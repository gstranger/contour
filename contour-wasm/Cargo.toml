[package]
name = "contour-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.5"
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = { version = "0.1", optional = true }
contour = { path = "../contour" }

[features]
default = []
console_error_panic_hook = ["dep:console_error_panic_hook"]
simd = ["contour/simd"]
threads = ["contour/threads"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Disable wasm-pack's built-in wasm-opt step. release_npm.sh runs wasm-opt
# explicitly per variant with the right --enable-* flags. Without this, the
# default wasm-opt invocation silently strips shared memory + atomics from
# the threads variant.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
